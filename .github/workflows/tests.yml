name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same branch/PR
# so we don't queue up redundant work.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Preflight: tiny smoke test that verifies the package and its test
  # collection import cleanly. Catches setup-class failures (missing OS
  # libs, broken plugin configure, import-time syntax errors) in ~15s
  # so the fast tier doesn't waste 3 minutes failing for the same
  # reason on five jobs in parallel. Treated as a hard gate via
  # ``needs:`` — fast and inspector skip if this fails.
  preflight:
    name: Preflight (imports + collection)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install minimal Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Import smoke
        # Anything dlopen-style broken (missing libEGL etc.) trips this
        # one-liner inside 1s, with a clear ImportError instead of an
        # opaque pytest INTERNALERROR. If this passes, real test runs
        # below are guaranteed to at least reach collection.
        run: |
          uv run python -c "import rrational; import pytest; import pytestqt; print('imports OK')"

      - name: Collect-only sweep
        # `--collect-only` reaches the same plugin-configure path as a
        # real run but skips test execution — a ~10s sanity check that
        # every test file in the fast tier parses and discovers cleanly.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest \
            tests/analysis tests/cleaning tests/io tests/prep \
            tests/segments tests/gui tests/streamlit tests/test_cli.py \
            --collect-only -q

  # Fast tier: pure-Python tests + Streamlit AppTest smoke. Runs on every
  # push + PR. Should finish in ~3-5 minutes.
  fast:
    name: Fast (analysis + io + streamlit smoke)
    runs-on: ubuntu-22.04
    needs: preflight
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install minimal Qt runtime libs
        # uv sync pulls pytest-qt as a dev dependency. pytest-qt's
        # pytest_configure imports QtGui unconditionally, which dlopens
        # libEGL.so.1 even when the actual tests in this job touch only
        # plain Python / Streamlit AppTest. Without this step the suite
        # crashes during pytest configure with "libEGL.so.1: cannot open
        # shared object file" before any test runs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run fast suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest \
            tests/analysis \
            tests/cleaning \
            tests/io \
            tests/prep \
            tests/segments \
            tests/gui \
            tests/streamlit \
            tests/test_cli.py \
            -v --tb=short

  # Slow tier: full PyQt Inspector suite. Runs on PR + main pushes but is
  # gated so a failing fast tier doesn't waste 20 minutes here.
  inspector:
    name: Inspector (PyQt, offscreen)
    runs-on: ubuntu-22.04
    needs: fast
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Qt runtime deps for offscreen QPA
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon0 \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libfontconfig1 \
            libgl1 \
            libdbus-1-3

      - name: Install dependencies (including PyQt extras)
        run: uv sync --all-extras --dev

      - name: Run inspector suite (offscreen QPA)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest tests/inspector -v --tb=short
