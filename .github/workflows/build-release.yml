name: Build Desktop App

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.9.0
  workflow_dispatch:  # Allow manual trigger for testing

permissions:
  contents: write  # Needed for creating releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner versions are pinned (no *-latest) to avoid silent architecture
          # or toolchain migrations between releases. Bump deliberately.
          - os: windows-2022
            artifact_name: RRational-Windows
            asset_ext: .zip
            arch_label: x86_64
          - os: macos-13           # Last Intel runner (x86_64) - deprecated by GitHub in 2026-xx
            artifact_name: RRational-macOS-Intel
            asset_ext: .zip
            arch_label: x86_64
          - os: macos-14           # Apple Silicon (arm64)
            artifact_name: RRational-macOS-AppleSilicon
            asset_ext: .zip
            arch_label: arm64
          - os: ubuntu-24.04
            artifact_name: RRational-Linux
            asset_ext: .tar.gz
            arch_label: x86_64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }} / ${{ matrix.arch_label }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # Build tools pinned to prevent surprise breakage from upstream releases.
        # Bump deliberately after testing.
        run: |
          uv sync
          uv pip install 'pyinstaller>=6.10,<7.0' 'streamlit-desktop-app>=0.2.0,<1.0'

      # Linux: Install system dependencies for pywebview
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            gir1.2-webkit2-4.1 \
            python3-gi \
            python3-gi-cairo

      - name: Build desktop app
        run: |
          uv run streamlit-desktop-app build \
            src/rrational/gui/app.py \
            --name RRational \
            --pyinstaller-options \
              --collect-all streamlit \
              --collect-all streamlit_plotly_events \
              --collect-all plotly \
              --collect-all pywebview \
              --hidden-import neurokit2 \
              --hidden-import neurokit2.hrv \
              --hidden-import neurokit2.signal \
              --hidden-import scipy.signal \
              --hidden-import scipy.interpolate \
              --hidden-import scipy.stats \
              --hidden-import scipy.special \
              --hidden-import yaml \
              --hidden-import rrational \
              --hidden-import rrational.gui \
              --hidden-import rrational.gui.tabs \
              --hidden-import rrational.gui.plots \
              --hidden-import rrational.analysis \
              --hidden-import rrational.cleaning \
              --hidden-import rrational.io \
              --hidden-import rrational.prep \
              --hidden-import rrational.segments \
              --add-data "src/rrational/gui/assets${{ runner.os == 'Windows' && ';' || ':' }}rrational/gui/assets" \
              --add-data "data/demo${{ runner.os == 'Windows' && ';' || ':' }}data/demo" \
              --noconfirm
        shell: bash

      # Sanity check: verify the built binary matches the expected architecture.
      # Catches silent runner drift (e.g., macos-latest switching ARM→Intel) and
      # any future cross-arch build misconfiguration. Fails the job on mismatch.
      - name: Verify binary architecture (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="dist/RRational/RRational"
          echo "=== file $BIN ==="
          file "$BIN"
          EXPECTED="${{ matrix.arch_label }}"
          if ! file "$BIN" | grep -qi "$EXPECTED"; then
            echo "::error::Architecture mismatch: expected $EXPECTED, file output above."
            exit 1
          fi
          echo "OK: binary is $EXPECTED"

      # Package the build output
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a -tzip ${{ matrix.artifact_name }}.zip RRational/
        shell: bash

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ${{ matrix.artifact_name }}.zip RRational/

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf ${{ matrix.artifact_name }}.tar.gz RRational/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}${{ matrix.asset_ext }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: RRational ${{ github.ref_name }}
          body: |
            ## RRational ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Architecture |
            |----------|------|--------------|
            | Windows 10/11 | `RRational-Windows.zip` | x86_64 |
            | macOS (Intel) | `RRational-macOS-Intel.zip` | x86_64 |
            | macOS (Apple Silicon M1/M2/M3/M4) | `RRational-macOS-AppleSilicon.zip` | arm64 |
            | Linux (Ubuntu 22.04+/Debian 12+) | `RRational-Linux.tar.gz` | x86_64 |

            ### Which macOS build do I need?

            Click the Apple menu > **About This Mac** and check the **Chip** line:

            - `Apple M1` / `M2` / `M3` / `M4` → download **Apple Silicon**
            - `Intel Core …` → download **Intel**

            Running the wrong build produces the error `Bad CPU type in executable`.

            ### Installation

            1. Download the archive for your platform
            2. Extract the archive
            3. Run `RRational` (or `RRational.exe` on Windows)

            **macOS note:** Because the app is not yet code-signed, macOS may
            block it on first launch ("cannot be opened because the developer
            cannot be verified"). Right-click the `RRational` binary and choose
            **Open**, or run once in Terminal:
            `xattr -dr com.apple.quarantine /path/to/RRational`

            The app opens in a native window — no Python installation required.

            ---
            *Built automatically from [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})*
          files: |
            artifacts/RRational-Windows/RRational-Windows.zip
            artifacts/RRational-macOS-Intel/RRational-macOS-Intel.zip
            artifacts/RRational-macOS-AppleSilicon/RRational-macOS-AppleSilicon.zip
            artifacts/RRational-Linux/RRational-Linux.tar.gz
          draft: true  # Create as draft — review before publishing
          generate_release_notes: true
