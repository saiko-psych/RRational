[project]
name = "rrational"
version = "0.9.3"
description = "Free, open-source HRV analysis toolkit - a rational approach to heart rate variability"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "streamlit>=1.45.1",
    "pandas>=2.0",
    "neurokit2>=0.2.7",
    "numpy>=1.24",
    "plotly>=5.18",
    "streamlit-plotly-events>=0.0.6",
    "streamlit-shortcuts>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "black>=24.4",
    "ruff>=0.5",
    "pytest-qt>=4.4",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
rrational = "rrational.cli:main"

[project.optional-dependencies]
inspector = [
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "qtpy>=2.4.3",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

# Ship the inspector's static assets (SVG / PNG / ICO app icon) in the
# wheel so a `pip install rrational[inspector]` user gets the icon at
# runtime. uv_build includes everything under src/<package>/ by default
# but we whitelist explicitly here as documentation + insurance against
# the default ever tightening. The setuptools-style key is kept too so
# if the project ever swaps to a setuptools backend nothing regresses.
[tool.uv.build-backend]
source-include = ["src/rrational/inspector/assets/*"]

[tool.setuptools.package-data]
"rrational.inspector" = ["assets/*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
# pytest-xdist parallelisation: ``loadgroup`` keeps tests sharing a
# ``pytest.mark.xdist_group("name")`` marker on the same worker, which
# is what we need for the QSS theme + ProjectManager + standalone-entry
# tests that touch the QApplication singleton. ``loadscope`` is the
# next-best fallback (groups by module) but is too coarse for the
# Inspector suite where many widget tests live in the same module.
# Round 30 — ``-n auto`` activates pytest-xdist parallelism (one worker
# per logical CPU). Critically, this is what makes ``--dist=loadgroup``
# actually do anything: without ``-n`` the suite runs single-lane and
# the xdist_group markers are silently ignored, so theme-pollution tests
# (test_app.py theme suite) re-applied QSS over the entire stale widget
# tree of every prior test on the same worker — observed at ~600 s per
# theme test in the single-lane baseline, ~1 s with proper isolation.
# ``--durations=20`` makes the top-20 slowest tests visible on every
# pytest run so runtime drift is caught before it compounds. The
# tests/conftest.py session hook (added Round 30) writes the same data
# to tests/.runtime_log.json and compares it against the committed
# tests/runtime_baseline.json — regressions emit a warning but never
# fail the run, so the app's functional tests stay the only fail signal.
addopts = "--dist=loadgroup -n auto --durations=20"
markers = [
    "xdist_group: pin tests sharing the same group name to one xdist worker",
    "slow: Qt-heavy test that boots a MainWindow / qtbot widget tree; auto-applied by tests/inspector/conftest.py. Skip in the dev loop with -m 'not slow'.",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# PyInstaller .spec files are executed by PyInstaller, not Python; they have
# Analysis / PYZ / EXE / COLLECT / SPECPATH injected at runtime. Ruff's static
# analysis can't know that, so exclude them from lint to avoid F821 noise.
extend-exclude = ["*.spec"]
