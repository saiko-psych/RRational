[project]
name = "rrational"
version = "0.9.3"
description = "Free, open-source HRV analysis toolkit - a rational approach to heart rate variability"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "streamlit>=1.45.1",
    "pandas>=2.0",
    "neurokit2>=0.2.7",
    "numpy>=1.24",
    "plotly>=5.18",
    "streamlit-plotly-events>=0.0.6",
    "streamlit-shortcuts>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "black>=24.4",
    "ruff>=0.5",
    "pytest-qt>=4.4",
]

[project.scripts]
rrational = "rrational.cli:main"

[project.optional-dependencies]
inspector = [
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "qtpy>=2.4.3",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

# Ship the inspector's static assets (SVG / PNG / ICO app icon) in the
# wheel so a `pip install rrational[inspector]` user gets the icon at
# runtime. uv_build includes everything under src/<package>/ by default
# but we whitelist explicitly here as documentation + insurance against
# the default ever tightening. The setuptools-style key is kept too so
# if the project ever swaps to a setuptools backend nothing regresses.
[tool.uv.build-backend]
source-include = ["src/rrational/inspector/assets/*"]

[tool.setuptools.package-data]
"rrational.inspector" = ["assets/*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
# PyInstaller .spec files are executed by PyInstaller, not Python; they have
# Analysis / PYZ / EXE / COLLECT / SPECPATH injected at runtime. Ruff's static
# analysis can't know that, so exclude them from lint to avoid F821 noise.
extend-exclude = ["*.spec"]
