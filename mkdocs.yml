site_name: RRational
site_description: "A rational approach to Heart Rate Variability analysis"
site_url: https://rrational.readthedocs.io/
repo_url: https://github.com/saiko-psych/rrational
repo_name: saiko-psych/rrational
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - header.autohide
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: fontawesome/solid/note-sticky
      tip: fontawesome/solid/lightbulb
      warning: fontawesome/solid/triangle-exclamation
      danger: fontawesome/solid/skull-crossbones
      info: fontawesome/solid/circle-info
      example: fontawesome/solid/flask

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/saiko-psych/rrational
  version:
    provider: mike

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - tables
  - def_list
  - attr_list
  - md_in_html
  - footnotes
  - abbr
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets

nav:
  - Home: index.md
  - Getting Started:
    - When to Use RRational: getting-started/use-cases.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Inspector Standalone App: getting-started/inspector.md
    - FAQ: getting-started/faq.md
  - User Guide:
    - Complete Workflow: user-guide/workflow.md
    - Data Formats: user-guide/data-formats.md
    - Configuration & Projects: user-guide/configuration.md
    - Kubios Compatibility: user-guide/kubios-compatibility.md
    - Inspector Features: user-guide/inspector-features.md
    - Inspector Keyboard Shortcuts: user-guide/inspector-keyboard-shortcuts.md
    - Inspector Workflows: user-guide/inspector-workflows.md
    - Inspector BIDS Workflow: user-guide/inspector-bids-workflow.md
    - Inspector Recipe Replay: user-guide/inspector-recipe-replay.md
  - Methodology:
    - Recommended Workflow: science/recommended-workflow.md
    - HRV Guidelines: science/guidelines.md
    - Processing Pipeline: science/processing-pipeline.md
    - Validation: science/validation.md
  - Development:
    - Architecture: development/architecture.md
    - Contributing: development/contributing.md
    - Issue Handling: development/issue-handling.md
  - Reference:
    - Glossary: reference/glossary.md
    - Inspector Menu Reference: reference/inspector-menu-reference.md
