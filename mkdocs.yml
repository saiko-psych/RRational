site_name: RRational
site_description: "A rational approach to Heart Rate Variability analysis"
site_url: https://rrational.readthedocs.io/
repo_url: https://github.com/saiko-psych/rrational
repo_name: saiko-psych/rrational
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.select
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - tables
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
    - When to Use RRational: getting-started/use-cases.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - FAQ: getting-started/faq.md
  - User Guide:
    - Complete Workflow: user-guide/workflow.md
    - Data Formats: user-guide/data-formats.md
    - Configuration & Projects: user-guide/configuration.md
  - Science:
    - HRV Guidelines: science/guidelines.md
    - Processing Pipeline: science/processing-pipeline.md
  - Development:
    - Architecture: development/architecture.md
    - Contributing: development/contributing.md
    - Issue Handling: development/issue-handling.md
  - Reference:
    - Glossary: reference/glossary.md
